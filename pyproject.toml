[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ria"
version = "0.1.0"
description = "Locate radiation interactions from a plenoptic single-photon image, and design the lens array that makes it possible."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["rekin>=0.1.26.8.0", "numpy>=1.24", "matplotlib>=3.6"]


[tool.setuptools.packages.find]
where = ["src"]
